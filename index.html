<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f5fa" />
    <meta
      name="description"
      content="Agenda, pacientes y economía de tu consultorio. Versión local de Camicas."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Camicas" />
    <title>Camicas · Consultorio</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f5fa;
        --surface: #fff;
        --surface2: #f1edf6;
        --ink: #353044;
        --muted: #756e82;
        --line: #e7e1ee;
        --primary: #7960a2;
        --primary-hover: #664b90;
        --soft: #f0eafb;
        --peach: #f5e4d7;
        --peach-ink: #925939;
        --red: #ac4d53;
        --red-soft: #faecec;
        --blue: #476681;
        --blue-soft: #edf2f8;
        --shadow: 0 16px 60px #3724451a;
        --radius: 20px;
      }
      [data-theme="dark"] {
        color-scheme: dark;
        --bg: #1e1927;
        --surface: #2b2336;
        --surface2: #342b40;
        --ink: #f2edf7;
        --muted: #b8acc6;
        --line: #493c56;
        --primary: #c1a4e6;
        --primary-hover: #d0b7ed;
        --soft: #3b2b50;
        --peach: #493629;
        --peach-ink: #e7b99a;
        --red: #efa1a5;
        --red-soft: #442d31;
        --blue: #afc6e0;
        --blue-soft: #2d3a49;
        --shadow: 0 16px 60px #0005;
      }
      * {
        box-sizing: border-box;
      }
      html {
        font-size: 16px;
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        font-family:
          Inter,
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        line-height: 1.5;
        background: var(--bg);
        color: var(--ink);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      a,
      input,
      select,
      textarea {
        -webkit-tap-highlight-color: transparent;
      }
      button,
      a {
        touch-action: manipulation;
      }
      button {
        cursor: pointer;
      }
      button {
        border: 0;
      }
      a {
        color: inherit;
      }
      svg.icon {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        stroke-width: 1.7;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 2rem;
        font-weight: 650;
        letter-spacing: -1.1px;
        line-height: 1.2;
      }
      h2 {
        font-size: 1.14rem;
        letter-spacing: -0.35px;
        font-weight: 650;
      }
      h3 {
        font-size: 1rem;
        font-weight: 600;
      }
      small,
      .small {
        font-size: 0.875rem;
      }
      strong {
        font-weight: 650;
      }
      .muted {
        color: var(--muted);
      }
      .eyebrow {
        text-transform: uppercase;
        font-size: 0.75rem;
        letter-spacing: 1.8px;
        color: var(--muted);
        font-weight: 600;
        margin-bottom: 10px;
      }
      .skip {
        position: fixed;
        top: -60px;
        left: 10px;
        z-index: 99;
        background: var(--primary);
        color: var(--bg);
        padding: 12px;
      }
      .skip:focus {
        top: 10px;
      }
      :focus-visible {
        outline: 3px solid var(--peach-ink);
        outline-offset: 3px;
      }
      .sidebar {
        display: none;
      }
      .workspace {
        min-width: 0;
      }
      .topbar {
        height: 74px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        gap: 12px;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
      }
      .mobile-brand {
        font-size: 1.55rem;
        font-weight: 700;
        letter-spacing: -1px;
        text-decoration: none;
      }
      .mobile-brand span {
        color: var(--peach-ink);
      }
      .global-search {
        display: flex;
        align-items: center;
        gap: 10px;
        background: transparent;
        color: var(--muted);
        padding: 12px;
        min-height: 44px;
      }
      .global-search .search-label,
      .search-shortcut {
        display: none;
      }
      .header-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .icon-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        color: var(--ink);
        min-width: 44px;
        min-height: 44px;
        border-radius: 12px;
        font-size: 1.5rem;
      }
      .icon-button:hover {
        background: var(--surface2);
      }
      .profile-button {
        height: 38px;
        width: 38px;
        border-radius: 50%;
        background: var(--peach);
        color: var(--peach-ink);
        font-weight: 650;
      }
      .page-footer {
        padding: 0 20px 120px;
        color: var(--muted);
        font-size: 0.75rem;
        text-align: center;
      }
      .page-footer span {
        padding: 0 8px;
      }
      main {
        padding: 26px 18px 32px;
        max-width: 1450px;
        margin: auto;
        outline: none;
      }
      .page-heading {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 26px;
      }
      .page-heading p {
        font-size: 0.875rem;
        color: var(--muted);
        margin-top: 7px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 46px;
        padding: 11px 17px;
        border-radius: 12px;
        color: var(--ink);
        background: var(--surface2);
        font-weight: 600;
        font-size: 0.875rem;
        line-height: 1.35;
        text-decoration: none;
      }
      .btn:hover {
        filter: brightness(0.97);
      }
      .btn.primary {
        background: var(--primary);
        color: var(--surface);
      }
      [data-theme="dark"] .btn.primary {
        color: #251632;
      }
      .btn.outline {
        background: var(--surface);
        border: 1px solid var(--line);
      }
      .btn.danger {
        background: var(--red-soft);
        color: var(--red);
      }
      .btn.small {
        min-height: 40px;
        padding: 8px 12px;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .text-button {
        background: transparent;
        color: var(--primary);
        padding: 8px 0;
        min-height: 40px;
        font-size: 0.875rem;
        font-weight: 600;
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 22px;
        min-width: 0;
      }
      .card-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
      }
      .card-head h2 {
        flex: 1;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 22px;
      }
      .stat {
        text-align: left;
        border: 1px solid var(--line);
        background: var(--surface);
        padding: 18px;
        border-radius: 16px;
        color: var(--ink);
        transition:
          transform 0.18s,
          border-color 0.18s;
        min-width: 0;
      }
      .stat:hover {
        transform: translateY(-2px);
        border-color: var(--primary);
      }
      .stat-top {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 0.875rem;
        gap: 7px;
      }
      .stat .number {
        font-size: 1.6rem;
        font-weight: 650;
        letter-spacing: -0.8px;
        margin-top: 12px;
        overflow-wrap: anywhere;
      }
      .stat small {
        display: block;
        color: var(--muted);
        margin-top: 4px;
        font-size: 0.75rem;
      }
      .stat .icon {
        color: var(--primary);
      }
      .dashboard-grid {
        display: grid;
        gap: 18px;
      }
      .stack {
        display: grid;
        gap: 18px;
        align-content: start;
      }
      .next-card {
        background: var(--soft);
        border-color: transparent;
      }
      .next-card .eyebrow {
        color: var(--primary);
      }
      .next-time {
        font-size: 2.7rem;
        line-height: 1;
        font-weight: 650;
        letter-spacing: -1.5px;
        margin: 20px 0 7px;
      }
      .next-card h3 {
        font-size: 1.3rem;
      }
      .next-card .actions {
        margin-top: 22px;
      }
      .next-meta {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 0.875rem;
        margin-top: 8px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border-radius: 7px;
        background: var(--surface2);
        color: var(--muted);
        padding: 4px 9px;
        font-size: 0.75rem;
        font-weight: 600;
        white-space: normal;
      }
      .pill.Agendado {
        background: var(--blue-soft);
        color: var(--blue);
      }
      .pill.Realizado {
        background: var(--soft);
        color: var(--primary);
      }
      .pill.Cancelado,
      .pill.Ausente {
        background: var(--red-soft);
        color: var(--red);
      }
      .pill.pending {
        background: var(--peach);
        color: var(--peach-ink);
      }
      .day-list {
        display: grid;
        gap: 0;
      }
      .session-row {
        display: grid;
        grid-template-columns: 54px 1fr auto;
        align-items: start;
        gap: 12px;
        padding: 18px 0;
        border-top: 1px solid var(--line);
      }
      .session-row:first-child {
        border-top: 0;
      }
      .session-time {
        font-size: 0.9rem;
        font-weight: 650;
        line-height: 1.6;
      }
      .session-time small {
        font-size: 0.75rem;
        display: block;
        font-weight: 400;
        color: var(--muted);
      }
      .session-main {
        min-width: 0;
      }
      .session-name {
        color: var(--ink);
        font-size: 0.94rem;
        font-weight: 600;
        background: transparent;
        text-align: left;
        padding: 0;
        overflow-wrap: anywhere;
        min-height: 28px;
      }
      .session-info {
        font-size: 0.8125rem;
        color: var(--muted);
        margin-top: 4px;
      }
      .session-status {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .row-actions {
        display: flex;
        gap: 4px;
      }
      .empty {
        text-align: center;
        padding: 24px 10px;
        color: var(--muted);
      }
      .empty .empty-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border-radius: 16px;
        margin: 0 auto 14px;
        background: var(--surface2);
        color: var(--primary);
      }
      .empty h3 {
        color: var(--ink);
        margin-bottom: 7px;
      }
      .empty p {
        font-size: 0.875rem;
        max-width: 330px;
        margin: 0 auto 16px;
      }
      .quick-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 9px;
      }
      .quick-grid button {
        background: var(--surface2);
        color: var(--ink);
        border-radius: 13px;
        min-height: 86px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 9px;
        font-size: 0.875rem;
      }
      .quick-grid button:hover {
        background: var(--soft);
      }
      .week-mini {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 5px;
      }
      .week-day {
        background: transparent;
        color: var(--muted);
        border-radius: 12px;
        padding: 10px 2px;
        min-height: 95px;
        font-size: 0.75rem;
      }
      .week-day.today {
        background: var(--soft);
        color: var(--primary);
      }
      .week-day b {
        display: block;
        font-size: 1rem;
        margin: 3px 0 10px;
      }
      .mini-count {
        display: block;
        background: var(--surface2);
        border-radius: 5px;
        font-size: 0.75rem;
        margin: 0 3px;
        padding: 2px;
      }
      .task-row {
        display: flex;
        gap: 11px;
        align-items: flex-start;
        padding: 13px 0;
        border-top: 1px solid var(--line);
      }
      .task-row:first-child {
        border: 0;
      }
      .task-row input {
        width: 21px;
        height: 21px;
        margin-top: 2px;
        accent-color: var(--primary);
      }
      .task-row label {
        flex: 1;
        font-size: 0.875rem;
        overflow-wrap: anywhere;
      }
      .task-row.done label {
        text-decoration: line-through;
        color: var(--muted);
      }
      .task-row small {
        display: block;
        color: var(--muted);
        margin-top: 2px;
      }
      .alert {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        border-radius: 12px;
        padding: 13px 15px;
        background: var(--peach);
        color: var(--peach-ink);
        font-size: 0.875rem;
        margin: 12px 0;
      }
      .alert.info {
        background: var(--soft);
        color: var(--primary);
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      .toolbar > * {
        max-width: 100%;
      }
      .toolbar .grow {
        flex: 1;
        min-width: 140px;
      }
      .input,
      .toolbar input,
      .toolbar select {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 11px 13px;
        min-height: 46px;
        color: var(--ink);
        width: 100%;
        min-width: 0;
      }
      .toolbar select {
        width: auto;
        max-width: 230px;
      }
      .segmented {
        display: flex;
        padding: 4px;
        border-radius: 12px;
        background: var(--surface2);
        gap: 2px;
        flex-wrap: wrap;
      }
      .segmented button {
        color: var(--muted);
        background: transparent;
        min-height: 40px;
        flex: 1;
        padding: 8px 12px;
        border-radius: 9px;
        font-size: 0.875rem;
        font-weight: 600;
        white-space: nowrap;
      }
      .segmented button.active {
        background: var(--surface);
        color: var(--primary);
        box-shadow: 0 2px 6px #00000008;
      }
      .date-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 5px;
        margin-bottom: 18px;
      }
      .date-nav strong {
        font-size: 0.95rem;
        text-align: center;
      }
      .date-nav .input {
        width: auto;
        max-width: 170px;
        font-size: 0.875rem;
      }
      .calendar {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        border-top: 1px solid var(--line);
        border-left: 1px solid var(--line);
        overflow: hidden;
        border-radius: 14px;
      }
      .calendar-label {
        font-size: 0.75rem;
        font-weight: 600;
        padding: 12px 2px;
        text-align: center;
        background: var(--surface2);
        border-right: 1px solid var(--line);
      }
      .month-cell {
        min-height: 74px;
        position: relative;
        padding: 6px 3px;
        border-bottom: 1px solid var(--line);
        border-right: 1px solid var(--line);
        min-width: 0;
        background: var(--surface);
      }
      .month-cell.outside {
        opacity: 0.45;
      }
      .month-cell.today {
        background: var(--soft);
      }
      .month-cell.selected {
        box-shadow: inset 0 0 0 2px var(--primary);
      }
      .day-number {
        background: transparent;
        color: var(--ink);
        padding: 3px 5px;
        min-width: 28px;
        min-height: 30px;
        font-size: 0.875rem;
      }
      .month-event {
        display: none;
      }
      .mobile-count {
        font-size: 0.75rem;
        display: block;
        text-align: center;
        color: var(--primary);
        cursor: pointer;
      }
      .calendar-detail {
        margin-top: 22px;
      }
      .week-columns {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 9px;
      }
      .week-column {
        padding: 12px 8px;
        background: var(--surface2);
        border-radius: 14px;
        min-width: 0;
        min-height: 220px;
      }
      .week-column header {
        text-align: center;
        font-size: 0.875rem;
        margin-bottom: 14px;
      }
      .week-column header b {
        display: block;
        font-size: 1.2rem;
      }
      .week-column.today {
        background: var(--soft);
      }
      .week-event {
        display: block;
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--line);
        border-left: 3px solid var(--blue);
        padding: 10px 8px;
        border-radius: 9px;
        text-align: left;
        color: var(--ink);
        font-size: 0.875rem;
        overflow-wrap: anywhere;
        margin-bottom: 8px;
        cursor: grab;
      }
      .week-event.Realizado {
        border-left-color: var(--primary);
      }
      .week-event.Cancelado,
      .week-event.Ausente {
        border-left-color: var(--red);
        opacity: 0.75;
      }
      .week-event.pending {
        border-left-color: var(--peach-ink);
      }
      .week-event small {
        display: block;
        font-size: 0.75rem;
        color: var(--muted);
        margin: 4px 0;
      }
      .day-create {
        font-size: 0.75rem;
        color: var(--primary);
        min-height: 40px;
        background: transparent;
        width: 100%;
        text-align: center;
      }
      .drop-over {
        outline: 2px dashed var(--primary);
        outline-offset: -3px;
      }
      .mobile-week {
        display: block;
      }
      .desktop-week {
        display: none;
      }
      .list-heading {
        font-size: 0.875rem;
        color: var(--muted);
        font-weight: 600;
        padding: 14px 0 2px;
      }
      .patient-grid {
        display: grid;
        gap: 14px;
      }
      .patient-card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 17px;
        padding: 20px;
        text-align: left;
        color: var(--ink);
        transition:
          transform 0.18s,
          border-color 0.18s;
        min-width: 0;
      }
      .patient-card:hover {
        border-color: var(--primary);
        transform: translateY(-2px);
      }
      .patient-top {
        display: flex;
        align-items: center;
        gap: 13px;
      }
      .avatar {
        background: var(--soft);
        color: var(--primary);
        width: 47px;
        height: 47px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
        flex-shrink: 0;
        font-size: 0.875rem;
        font-weight: 650;
      }
      .patient-top h2 {
        font-size: 1rem;
        overflow-wrap: anywhere;
      }
      .patient-top small {
        display: block;
        color: var(--muted);
        margin-top: 3px;
      }
      .patient-bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 20px;
        padding-top: 15px;
        border-top: 1px solid var(--line);
        font-size: 0.875rem;
      }
      .patient-details {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
        margin: 20px 0;
      }
      .patient-details small {
        color: var(--muted);
        display: block;
        margin-bottom: 3px;
      }
      .patient-details p {
        overflow-wrap: anywhere;
        font-size: 0.875rem;
      }
      .balance-title {
        font-size: 2rem;
        font-weight: 650;
        letter-spacing: -1px;
        margin: 8px 0;
      }
      .period-card {
        background: var(--soft);
      }
      .summary-line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        margin: 13px 0;
        font-size: 0.875rem;
      }
      .summary-line.total {
        padding-top: 14px;
        border-top: 1px solid var(--line);
        font-weight: 650;
      }
      .economy-grid {
        display: grid;
        gap: 18px;
        margin-bottom: 20px;
      }
      .ledger-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 0;
        border-top: 1px solid var(--line);
      }
      .ledger-row:first-child {
        border: 0;
      }
      .ledger-left {
        flex: 1;
        min-width: 0;
      }
      .ledger-left strong {
        display: block;
        font-size: 0.9rem;
        overflow-wrap: anywhere;
      }
      .ledger-left small {
        color: var(--muted);
        display: block;
        margin-top: 4px;
      }
      .ledger-amount {
        font-size: 0.95rem;
        font-weight: 650;
        white-space: nowrap;

    <script>
      "use strict";
      // Camicas 2.0 — standalone data layer. No network requests or external libraries.
      const STORE = "camicas.v2.data",
        PREVIOUS = "camicas.v2.previous",
        VERSION = 2;
      const storageGet = (k) => {
        try {
          return localStorage.getItem(k);
        } catch {
          return null;
        }
      };
      const TABLES = [
        "patients",
        "appointments",
        "payments",
        "payment_allocations",
        "other_income",
        "expenses",
        "savings",
        "balance_items",
        "balance_movements",
        "categories",
        "settings",
        "tasks",
        "calendar_days",
        "calendar_days",
      ];
      const uuid = () =>
        globalThis.crypto?.randomUUID?.() ||
        "cx-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2);
      const clone = (x) => JSON.parse(JSON.stringify(x));
      const cents = (x) => Math.round((Number(x) || 0) * 100),
        amount = (x) => Math.round(x) / 100;
      const sum = (rows, key = "amount") => amount(rows.reduce((s, r) => s + cents(r[key]), 0));
      const iso = (d) =>
        [
          d.getUTCFullYear(),
          String(d.getUTCMonth() + 1).padStart(2, "0"),
          String(d.getUTCDate()).padStart(2, "0"),
        ].join("-");
      const dateObj = (s) => new Date(s + "T12:00:00Z");
      const addDays = (s, n) => {
        const d = dateObj(s);
        d.setUTCDate(d.getUTCDate() + n);
        return iso(d);
      };
      const addMonths = (s, n) => {
        const d = dateObj(s),
          day = d.getUTCDate();
        d.setUTCDate(1);
        d.setUTCMonth(d.getUTCMonth() + n);
        const end = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).getUTCDate();
        d.setUTCDate(Math.min(day, end));
        return iso(d);
      };
      const today = () =>
        new Intl.DateTimeFormat("en-CA", {
          timeZone: "America/Argentina/Cordoba",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
        }).format(new Date());
      const monthOf = (s) => String(s || "").slice(0, 7);
      const weekStart = (s) => {
        const day = dateObj(s).getUTCDay();
        return addDays(s, -((day + 6) % 7));
      };
      const validDate = (s) =>
        typeof s === "string" &&
        /^\d{4}-\d{2}-\d{2}$/.test(s) &&
        !Number.isNaN(dateObj(s).getTime()) &&
        iso(dateObj(s)) === s;
      const validMonth = (s) => typeof s === "string" && /^\d{4}-(0[1-9]|1[0-2])$/.test(s);
      const validTime = (s) => typeof s === "string" && /^([01]\d|2[0-3]):[0-5]\d$/.test(s);
      const fmtDate = (s, opts = { day: "numeric", month: "short" }) =>
        validDate(s)
          ? new Intl.DateTimeFormat("es-AR", { ...opts, timeZone: "UTC" }).format(dateObj(s))
          : "—";
      const money = (n) =>
        new Intl.NumberFormat("es-AR", {
          style: "currency",
          currency: "ARS",
          maximumFractionDigits: 2,
          minimumFractionDigits: 0,
        }).format(Number(n) || 0);
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );
      const normalize = (s) =>
        String(s || "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase();
      const DEFAULTS = {
        app_name: "camicas",
        default_duration: 50,
        default_fee: 40000,
        modalities: ["Presencial", "Virtual"],
        frequencies: ["Semanal", "Quincenal", "Mensual"],
        payment_methods: ["Mercado Pago", "Efectivo", "Transferencia", "Tarjeta", "Débito"],
      };
      function emptyData() {
        const data = Object.fromEntries(TABLES.map((t) => [t, []]));
        data.categories = [
          "Consultorio",
          "Servicios e impuestos",
          "Formación",
          "Personal",
          "Otros",
        ].map((name) => ({ id: uuid(), name, active: 1, group_name: "Otros" }));
        return {
          app: "camicas",
          version: VERSION,
          revision: 0,
          updatedAt: null,
          lastBackup: null,
          data,
        };
      }
      function getSetting(key, store = db) {
        const row = store.data.settings.find((x) => x.key === key);
        if (!row) return DEFAULTS[key];
        let value = row.value;
        try {
          value = JSON.parse(value);
        } catch {}
        return value ?? DEFAULTS[key];
      }
      function setSetting(store, key, value) {
        const row = store.data.settings.find((x) => x.key === key);
        const val = typeof value === "string" ? value : JSON.stringify(value);
        if (row) {
          row.value = val;
          row.updated_at = new Date().toISOString();
        } else
          store.data.settings.push({
            id: uuid(),
            key,
            value: val,
            updated_at: new Date().toISOString(),
          });
      }
      function listSetting(key) {
        const v = getSetting(key);
        return Array.isArray(v) && v.length ? v : DEFAULTS[key];
      }
      const patients = (store = db) => store.data.patients;
      const appointments = (store = db) => store.data.appointments;
      const patient = (id, store = db) => patients(store).find((x) => x.id === id);
      const appointment = (id, store = db) => appointments(store).find((x) => x.id === id);
      const activePayments = (store = db) => store.data.payments.filter((x) => !x.reversed);
      function allocations(store = db) {
        const ids = new Set(activePayments(store).map((x) => x.id));
        return store.data.payment_allocations.filter((x) => ids.has(x.payment_id));
      }
      function paid(a, store = db) {
        return sum(allocations(store).filter((x) => x.appointment_id === a.id));
      }
      function charge(a) {
        return a.appointment_status === "Cancelado" || a.financial_status === "Bonificado"
          ? 0
          : Number(a.fee) || 0;
      }
      function pending(a, store = db) {
        return amount(Math.max(0, cents(charge(a)) - cents(paid(a, store))));
      }
      function credit(a, store = db) {
        return amount(Math.max(0, cents(paid(a, store)) - cents(charge(a))));
      }
      function patientDebt(id, store = db) {
        return amount(
          appointments(store)
            .filter((a) => a.patient_id === id)
            .reduce((s, a) => s + cents(pending(a, store)), 0),
        );
      }
      function patientCredit(id, store = db) {
        return amount(
          appointments(store)
            .filter((a) => a.patient_id === id)
            .reduce((s, a) => s + cents(credit(a, store)), 0),
        );
      }
      function totals(month, store = db) {
        const a = appointments(store).filter((x) => monthOf(x.date) === month),
          p = activePayments(store).filter((x) => monthOf(x.date) === month),
          other = store.data.other_income.filter((x) => !x.deleted && monthOf(x.date) === month),
          e = store.data.expenses.filter((x) => !x.deleted && monthOf(x.date) === month),
          s = store.data.savings.filter((x) => !x.deleted && monthOf(x.date) === month),
          incoming = store.data.savings.filter(
            (x) => !x.deleted && x.type === "Traspaso" && x.destination_month === month,
          );
        const collected = sum(p),
          extra = sum(other),
          expenses = sum(e.filter((x) => x.status === "Pagado")),
          saving = sum(s),
          transfers = sum(incoming),
          expected = amount(a.reduce((n, x) => n + cents(charge(x)), 0)),
          due = amount(a.reduce((n, x) => n + cents(pending(x, store)), 0));
        return {
          collected,
          extra,
          expenses,
          saving,
          transfers,
          expected,
          due,
          result: amount(cents(collected) + cents(extra) - cents(expenses)),
          available: amount(
            cents(collected) + cents(extra) - cents(expenses) - cents(saving) + cents(transfers),
          ),
          planned: sum(e.filter((x) => x.status !== "Pagado")),
          count: a.filter((x) => x.appointment_status !== "Cancelado").length,
          completed: a.filter((x) => x.appointment_status === "Realizado").length,
        };
      }
      const sorted = (rows) =>
        [...rows].sort((a, b) =>
          (a.date + " " + a.start_time).localeCompare(b.date + " " + b.start_time),
        );
      const minutes = (t) => Number(t.slice(0, 2)) * 60 + Number(t.slice(3, 5));
      function collision(proposed, existing, exclude = new Set()) {
        const all = [
          ...existing.filter((x) => !exclude.has(x.id) && x.appointment_status !== "Cancelado"),
          ...proposed.filter((x) => x.appointment_status !== "Cancelado"),
        ];
        for (let i = 0; i < all.length; i++)
          for (let j = i + 1; j < all.length; j++) {
            const a = all[i],
              b = all[j];
            if (!proposed.some((x) => x.id === a.id || x.id === b.id)) continue;
            if (
              a.date === b.date &&
              minutes(a.start_time) < minutes(b.start_time) + Number(b.duration_minutes) &&
              minutes(b.start_time) < minutes(a.start_time) + Number(a.duration_minutes)
            )
              return { date: a.date, time: a.start_time };
          }
        return null;
      }
      function recurDates(start, frequency, count) {
        return Array.from({ length: count }, (_, i) =>
          frequency === "monthly"
            ? addMonths(start, i)
            : addDays(start, i * (frequency === "biweekly" ? 14 : 7)),
        );
      }
      function financialSync(a, store) {
        if (a.fee == null) {
          a.fee_pending = true;
          a.financial_status = "Por completar";
          return;
        }
        a.fee_pending = false;
        if (a.financial_status === "Bonificado") return;
        a.financial_status =
          pending(a, store) > 0 ? (paid(a, store) > 0 ? "Parcial" : "Pendiente") : "Cobrado";
      }
      function cashEffect(
        store,
        { date, method, delta, description, paymentId = null, appointmentId = null, sourceKey },
      ) {
        if (!cents(delta)) return;
        const m = monthOf(date);
        let item = store.data.balance_items.find(
          (x) => x.kind === "Activo" && x.month === m && normalize(x.name) === normalize(method),
        );
        if (!item) {
          item = {
            id: uuid(),
            kind: "Activo",
            month: m,
            name: method,
            amount: 0,
            note: "",
            automatic_key: "v2:" + method,
            created_at: new Date().toISOString(),
          };
          store.data.balance_items.push(item);
        }
        item.amount = amount(cents(item.amount) + cents(delta));
        store.data.balance_movements.push({
          id: uuid(),
          balance_item_id: item.id,
          payment_id: paymentId,
          appointment_id: appointmentId,
          date,
          amount: Math.abs(delta),
          signed_delta: delta,
          movement_type: delta >= 0 ? "Ingreso" : "Egreso",
          description,
          origin: "camicas-v2",
          source_key: sourceKey,
          created_at: new Date().toISOString(),
        });
      }
      function undoCash(store, sourceKey) {
        const movements = store.data.balance_movements.filter(
          (x) => x.source_key === sourceKey && x.origin === "camicas-v2" && !x.reversed,
        );
        for (const movement of movements) {
          const item = store.data.balance_items.find((x) => x.id === movement.balance_item_id);
          if (item) item.amount = amount(cents(item.amount) - cents(movement.signed_delta));
          movement.reversed = true;
        }
      }
      function registerPayment(store, { appointmentId, amount: value, date, method }) {
        const a = appointment(appointmentId, store);
        if (!a) throw Error("Elegí un turno válido.");
        if (a.fee == null) throw Error("Completá el honorario del turno antes de cobrar.");
        if (a.fee == null) throw Error("Completá el honorario del turno antes de cobrar.");
        if (a.appointment_status === "Cancelado" || a.financial_status === "Bonificado")
          throw Error("Este turno no admite un nuevo cobro.");
        if (!validDate(date)) throw Error("Revisá la fecha del cobro.");
        if (cents(value) <= 0 || cents(value) > cents(pending(a, store)))
          throw Error("El importe debe ser mayor a cero y no superar el saldo del turno.");
        const p = {
          id: uuid(),
          patient_id: a.patient_id,
          amount: amount(cents(value)),
          date,
          method,
          created_at: new Date().toISOString(),
          note: "",
        };
        store.data.payments.push(p);
        store.data.payment_allocations.push({
          id: uuid(),
          payment_id: p.id,
          appointment_id: a.id,
          amount: p.amount,
          created_at: p.created_at,
        });
        cashEffect(store, {
          date,
          method,
          delta: p.amount,
          description: "Cobro de sesión",
          paymentId: p.id,
          appointmentId: a.id,
          sourceKey: "payment:" + p.id,
        });
        financialSync(a, store);
        return p;
      }
      function reversePayment(store, id) {
        const p = store.data.payments.find((x) => x.id === id);
        if (!p || p.reversed) throw Error("El cobro ya fue anulado.");
        const own = store.data.balance_movements.some(
          (x) => x.source_key === "payment:" + id && x.origin === "camicas-v2",
        );
        if (own) undoCash(store, "payment:" + id);
        else {
          for (const m of store.data.balance_movements.filter(
            (x) => x.payment_id === id && !x.reversed,
          )) {
            const item = store.data.balance_items.find((x) => x.id === m.balance_item_id);
            if (item) item.amount = amount(cents(item.amount) - cents(m.amount));
            m.reversed = true;
          }
        }
        p.reversed = true;
        p.reversed_at = new Date().toISOString();
        for (const link of store.data.payment_allocations.filter((x) => x.payment_id === id)) {
          const a = appointment(link.appointment_id, store);
          if (a) financialSync(a, store);
        }
      }
      function assertImport(input) {
        if (!input || typeof input !== "object" || Array.isArray(input))
          throw Error("El archivo no es una copia de Camicas.");
        if (input.version != null && input.version !== VERSION)
          throw Error("La versión de esta copia no es compatible.");
        const raw = input.data;
        if (
          !raw ||
          typeof raw !== "object" ||
          !Array.isArray(raw.patients) ||
          !Array.isArray(raw.appointments) ||
          !Array.isArray(raw.payments) ||
          !Array.isArray(raw.payment_allocations)
        )
          throw Error("Faltan las tablas de pacientes, turnos, cobros o asignaciones.");
        const result = {
          ...clone(input),
          app: "camicas",
          version: VERSION,
          data: { ...clone(raw) },
        };
        for (const table of TABLES) {
          const rows = raw[table] ?? [];
          if (!Array.isArray(rows)) throw Error("La tabla " + table + " debe ser una lista.");
          if (rows.length > 100000) throw Error("La tabla " + table + " es demasiado grande.");
          result.data[table] = clone(rows);
          const ids = new Set();
          for (const row of rows) {
            if (
              !row ||
              typeof row !== "object" ||
              typeof row.id !== "string" ||
              !row.id.trim() ||
              ids.has(row.id)
            )
              throw Error("Hay un identificador ausente o duplicado en " + table + ".");
            ids.add(row.id);
            for (const key of ["amount", "fee", "default_fee", "signed_delta"])
              if (
                row[key] != null &&
                (!Number.isFinite(Number(row[key])) ||
                  Math.abs(Number(row[key])) > 1e12 ||
                  (!["balance_items", "balance_movements"].includes(table) && Number(row[key]) < 0))
              )

            if (row.date != null && !validDate(row.date))
              throw Error("Hay una fecha inválida en " + table + ".");
          }

          pid = ids("patients"),
          aid = ids("appointments"),
          payid = ids("payments"),
          bid = ids("balance_items");
        for (const p of result.data.patients)
          if (
            typeof p.name !== "string" ||
            !p.name.trim() ||
            !["Activo", "Inactivo"].includes(p.status)
          )
            throw Error("Hay una ficha sin nombre o con estado inválido.");
        for (const a of result.data.appointments)
          if (
            !pid.has(a.patient_id) ||
            !validDate(a.date) ||
            !validTime(a.start_time) ||
            !Number.isFinite(Number(a.duration_minutes)) ||
            Number(a.duration_minutes) < 5 ||
            minutes(a.start_time) + Number(a.duration_minutes) > 1440 ||
            !["Agendado", "Realizado", "Ausente", "Cancelado"].includes(a.appointment_status) ||
            (a.fee == null && a.fee_pending !== true)
          )
            throw Error("Hay un turno con datos inválidos o paciente inexistente.");
        for (const p of result.data.payments)
          if (
            !pid.has(p.patient_id) ||
            !validDate(p.date) ||
            p.amount == null ||
            typeof p.method !== "string"
          )
            throw Error("Hay un cobro con datos incompletos o paciente inexistente.");
        for (const x of result.data.payment_allocations) {
          const p = result.data.payments.find((p) => p.id === x.payment_id),
            a = result.data.appointments.find((a) => a.id === x.appointment_id);
          if (
            !payid.has(x.payment_id) ||
            !aid.has(x.appointment_id) ||
            p.patient_id !== a.patient_id ||
            x.amount == null
          )
            throw Error("Hay una asignación de cobro sin referencias válidas.");
        }
        for (const p of result.data.payments)
          if (
            cents(sum(result.data.payment_allocations.filter((x) => x.payment_id === p.id))) >
            cents(p.amount)
          )
            throw Error("Una asignación supera el importe del cobro.");
        for (const x of result.data.balance_items)
          if (
            !validMonth(x.month) ||
            !["Activo", "Pasivo"].includes(x.kind) ||
            typeof x.name !== "string" ||
            x.amount == null
          )
            throw Error("Hay una cuenta patrimonial inválida.");
        for (const x of result.data.balance_movements) {
          if (!bid.has(x.balance_item_id))
            throw Error("Un movimiento se refiere a una cuenta inexistente.");

            x.origin === "camicas-v2" &&
            (x.signed_delta == null || !Number.isFinite(Number(x.signed_delta)))
          )

        }

          if (typeof x.key !== "string" || typeof x.value !== "string")
            throw Error("Hay una preferencia inválida.");
        for (const x of result.data.expenses)
          if (
            !validDate(x.date) ||
            typeof x.concept !== "string" ||
            !["Pagado", "A pagar", "Planificado"].includes(x.status) ||
            x.amount == null
          )
            throw Error(
              "El formato de un gasto no pudo verificarse. Conservá esa copia para revisarla.",
            );
        for (const x of result.data.savings)
          if (
            !validDate(x.date) ||
            typeof x.concept !== "string" ||
            !["Ahorro/Reserva", "Traspaso"].includes(x.type) ||
            x.amount == null ||
            (x.type === "Traspaso" && !validMonth(x.destination_month ?? x.destinationMonth))

", "plus")}</div><label class="small muted"><input type="checkbox" id="show-done" ${view.showDone ? "checked" : ""}> Mostrar completados</label>${taskRows()}</section><section class="card"><div class="card-head"><h2>Acerca de esta versión</h2></div><p class="small muted">Archivo HTML independiente. La conexión opcional con Google utiliza su servicio de autorización para leer respuestas; los registros del consultorio se guardan en este navegador y no se suben a GitHub.</p><div class="alert">${icon("bell")}<span>El almacenamiento local no tiene contraseña ni cifrado. Usá un dispositivo protegido y descargá respaldos: borrar los datos del navegador puede eliminar tus registros.</span></div><p class="small muted">Para migrar desde el sitio original, descargá «Exportar copia completa» en Más e importá ese JSON acá. Cada archivo o dirección puede tener su propio guardado.</p><button class="text-button" data-act="help">Ver ayuda de uso y compatibilidad</button></section></div>`

      async function readImport(file) {
        if (!file) return;
        try {
          if (file.size > 25 * 1024 * 1024) throw Error("La copia supera los 25 MB.");
          const raw = JSON.parse(await file.text());
          stagedImport = assertImport(raw);
          const d = stagedImport.data;
          document.getElementById("import-preview").innerHTML =
            `<div class="import-report"><strong>Copia válida</strong><br>${d.patients.length} pacientes · ${d.appointments.length} turnos<br>${d.payments.length} cobros · ${d.expenses.length} gastos<br>${d.balance_items.length} cuentas · ${d.savings.length} ahorros / traspasos</div><div class="alert">Esta acción reemplaza los registros locales. Antes se descargará una copia del guardado actual y se conservará una copia recuperable en este navegador.</div><p class="small muted">Los saldos patrimoniales se conservan sin volver a sumar sus movimientos. No se modifica el sitio original.</p><div class="form-actions">${btn("Volver", "close", "outline")}${btn("Importar y reemplazar", "confirm-import", "primary")}</div>`;
          document.getElementById("form-error").textContent = "";
        } catch (e) {
          stagedImport = null;
          document.getElementById("import-preview").innerHTML = "";
          showError(e.message || "No se pudo leer el archivo JSON.");
        }
      }
      function commitImport(candidate) {
        try {
          if (!storageBlocked && modalRevision !== db.revision)
            throw Error(
              "El guardado cambió desde que abriste esta ventana. Volvé a seleccionar la copia.",
            );
          if (!candidate) throw Error("Primero elegí una copia válida.");
          const next = assertImport(candidate),
            oldRaw = localStorage.getItem(STORE) || JSON.stringify(db),
            previousRaw = localStorage.getItem(PREVIOUS);
          next.revision = db.revision + 1;
          next.updatedAt = new Date().toISOString();
          next.lastBackup = null;
          const newRaw = JSON.stringify(next);
          localStorage.setItem(PREVIOUS, oldRaw);
          try {
            localStorage.setItem(STORE, newRaw);
          } catch (e) {
            if (previousRaw) localStorage.setItem(PREVIOUS, previousRaw);
            else localStorage.removeItem(PREVIOUS);
            throw e;
          }
          exportData(db, false);
          db = next;
          storageBlocked = false;
          loadError = null;
          closeModal();
          render();
          toast("Copia importada. El guardado anterior quedó disponible en Más.");
        } catch (e) {
          showError(e.message || "No se pudo importar. El guardado actual se conserva.");
        }
      }

ros; la restauración completa usa JSON. Mover el archivo, cambiar de navegador o abrir otra dirección puede cambiar el lugar donde se guardan los datos.</p></div></div>`,

          ? `<div class="special-notice">${days.map((x) => `<div><strong>${esc(x.name)}</strong>${x.source ? ` <a href="${esc(x.source)}" target="_blank" rel="noopener noreferrer">Norma</a>` : " <small>Fecha personal</small>"}</div>`).join("")}</div>`
          : "";
      }
      const renderBeforeHolidays = render;
      render = function () {
        renderBeforeHolidays();
        for (const el of main.querySelectorAll("[data-drop-date],button.week-day[data-date]")) {
          const date = el.dataset.dropDate || el.dataset.date,
            days = specialDays(date);
          if (days.length) {
            el.classList.add("special-" + days[0].kind);
            el.title = days.map((x) => x.name).join(" · ");
            el.setAttribute(
              "aria-label",
              (el.getAttribute("aria-label") || fmtDate(date, { day: "numeric", month: "long" })) +
                " · " +
                el.title,
            );
            const number = el.querySelector(".day-number");
            if (number)
              number.setAttribute("aria-label", "Ver " + fmtDate(date) + " · " + el.title);
          }
        }
        if (view.page === "agenda") {
          const date = view.date;
          main.querySelector(".date-nav")?.insertAdjacentHTML("afterend", specialNotice(date));
          const start =
            view.agendaMode === "month"
              ? monthOf(date) + "-01"
              : view.agendaMode === "week"
                ? weekStart(date)
                : date;
          const end =
            view.agendaMode === "month"
              ? addDays(addMonths(start, 1), -1)
              : view.agendaMode === "week"
                ? addDays(start, 6)
                : date;
          const dates = [];
          for (let d = start; d <= end; d = addDays(d, 1)) if (specialDays(d).length) dates.push(d);
          if (dates.length)
            main.insertAdjacentHTML(
              "beforeend",
              `<section class="card special-list" style="margin-top:18px"><h2>Fechas para tener en cuenta</h2>${dates
                .map(
                  (d) =>
                    `<div class="special-line special-${specialDays(d)[0].kind}"><strong>${esc(fmtDate(d))}</strong><span>${specialDays(
                      d,
                    )
                      .map((x) => esc(x.name))
                      .join(" · ")}</span></div>`,
                )
                .join("")}</section>`,
            );
        }
        if (view.page === "hoy")
          main
            .querySelector(".page-heading")
            ?.insertAdjacentHTML("afterend", specialNotice(today()));
      };

      // OAuth tokens stay in memory. Form responses are merged into this browser only.
      const FORM_LINK_STORE = "camicas.v2.form-link";
      let formLink = { clientId: "", formId: "", enabled: false },
        formAccessToken = null,
        formTokenUntil = 0,
        formSyncBusy = false;
      try {
        const saved = JSON.parse(storageGet(FORM_LINK_STORE) || "null");
        if (saved && typeof saved === "object") formLink = { ...formLink, ...saved };
      } catch {}
      function saveFormLink() {
        localStorage.setItem(FORM_LINK_STORE, JSON.stringify(formLink));
      }
      function formLinkModal() {
        openModal(
          "Conectar Google Forms",
          `<p class="small muted">La conexión lee respuestas con permiso de la cuenta propietaria. No publica la hoja ni el formulario. Hace falta configurar el acceso de Google una sola vez.</p>${formShell("form-link", field("ID de cliente de Google", "clientId", formLink.clientId, "text", 'required placeholder="…apps.googleusercontent.com"') + field("Enlace o ID del formulario", "formId", formLink.formId, "text", "required"), { submit: "Guardar conexión", extra: '<p class="muted small">El permiso de acceso lo autoriza Camila en la ventana de Google. Las respuestas se revisan al conectar y cada cinco minutos mientras la app permanece abierta y autorizada.</p>' })}`,
          "form-link",
        );
      }
      function normalizeFormId(value) {
        const match = value.trim().match(/\/forms\/d\/([^/]+)/);
        const id = match ? match[1] : value.trim();
        if (!/^[A-Za-z0-9_-]{20,200}$/.test(id))
          throw Error("Revisá el enlace o ID del formulario.");
        return id;
      }
      function validateFormConnection(value) {
        if (!value || typeof value.clientId !== "string" || typeof value.formId !== "string")
          throw Error("La configuración del formulario está incompleta.");
        const clientId = value.clientId.trim();
        if (!/^[A-Za-z0-9._-]+\.apps\.googleusercontent\.com$/.test(clientId))
          throw Error("Revisá el ID de cliente de Google.");
        return { clientId, formId: normalizeFormId(value.formId) };
      }
      document.addEventListener("submit", (e) => {
        const f = e.target;
        if (f.dataset.form !== "form-link") return;
        e.preventDefault();
        try {
          const values = Object.fromEntries(new FormData(f)),
            clientId = values.clientId.trim();
          if (!/^[A-Za-z0-9._-]+\.apps\.googleusercontent\.com$/.test(clientId))
            throw Error("Revisá el ID de cliente de Google.");
          formLink = { clientId, formId: normalizeFormId(values.formId), enabled: true };
          saveFormLink();
          loadGoogleIdentity().catch(() => {});
          closeModal();
          render();
          toast("Configuración guardada. Tocá Autorizar y sincronizar.");
        } catch (error) {
          showError(error.message);
        }
      });
      let identityReady = null;
      function loadGoogleIdentity() {
        if (identityReady) return identityReady;
        identityReady = new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = "https://accounts.google.com/gsi/client";
          script.onload = resolve;
          script.onerror = () => {
            identityReady = null;
            reject(Error("No se pudo conectar con Google. Revisá la conexión a internet."));
          };
          document.head.append(script);
        });
        return identityReady;
      }
      function authorizeForm() {
        if (!formLink.clientId || !formLink.formId) {
          formLinkModal();
          return;
        }
        if (!window.google?.accounts?.oauth2) {
          loadGoogleIdentity()
            .then(() => toast("Google está listo. Volvé a tocar Autorizar y sincronizar."))
            .catch((e) => toast(e.message, true));
          return;
        }
        try {
          google.accounts.oauth2
            .initTokenClient({
              client_id: formLink.clientId,
              scope:
                "https://www.googleapis.com/auth/forms.body.readonly https://www.googleapis.com/auth/forms.responses.readonly",
              callback: async (response) => {
                if (response.error) {
                  toast("Google no autorizó la conexión.", true);
                  return;
                }
                if (
                  !google.accounts.oauth2.hasGrantedAllScopes(
                    response,
                    "https://www.googleapis.com/auth/forms.body.readonly",
                    "https://www.googleapis.com/auth/forms.responses.readonly",
                  )
                ) {
                  toast("Falta autorizar la lectura del formulario y sus respuestas.", true);
                  return;
                }
                formAccessToken = response.access_token;
                formTokenUntil = Date.now() + Number(response.expires_in) * 1000;
                await syncForm();
              },
              error_callback: () => toast("La autorización de Google quedó sin completar.", true),
            })
            .requestAccessToken({ prompt: "" });
        } catch (error) {
          toast(error.message, true);
        }
      }
      async function googleFormRequest(path) {
        const response = await fetch("https://forms.googleapis.com/v1/" + path, {
          headers: { Authorization: "Bearer " + formAccessToken },
        });
        if (response.status === 401) {
          formAccessToken = null;
          throw Error("Google pide renovar el permiso. Tocá Autorizar y sincronizar.");
        }
        if (!response.ok)
          throw Error(
            response.status === 403
              ? "La cuenta no tiene acceso a las respuestas o falta habilitar la API de Google Forms."
              : "No se pudieron leer las respuestas de Google.",
          );
        return response.json();
      }
      function answersToPatients(form, responses) {
        const fields = {};
        for (const item of form.items || []) {
          const id = item.questionItem?.question?.questionId;
          if (!id) continue;
          const title = normalize(item.title);
          let key = null;
          if (title.includes("nombre completo")) key = "name";
          else if (title === "correo" || title.includes("correo electronico")) key = "email";
          else if (title.includes("emergencia 1")) key = "emergency_1";
          else if (title.includes("emergencia 2")) key = "emergency_2";
          else if (title.includes("telefono")) key = "phone";
          else if (title === "edad") key = "age_declared";
          if (key) fields[id] = key;
        }
        if (!Object.values(fields).includes("name"))
          throw Error("El formulario no contiene una pregunta identificable de Nombre Completo.");
        return responses.map((response) => {
          const row = {
            id: "form-" + response.responseId,
            status: "Activo",
            name: "",
            email: "",
            phone: "",
            age_declared: "",
            emergency_1: "",
            emergency_2: "",
            modality: "",
            frequency: "",
            locality: "",
            default_fee: null,
            source_key: "google-form:" + form.formId + ":" + response.responseId,
            source_submitted_at: response.createTime || "",
          };
          for (const [id, key] of Object.entries(fields))
            row[key] = (response.answers?.[id]?.textAnswers?.answers || [])
              .map((x) => x.value || "")
              .join("\n")
              .trim();
          if (!row.name)
            throw Error("Una respuesta está sin nombre. No se aplicó la sincronización.");
          return row;
        });
      }
      async function syncForm() {
        if (formSyncBusy || !formLink.enabled) return;
        if (!formAccessToken || Date.now() >= formTokenUntil) {
          toast("Tocá Autorizar y sincronizar para leer respuestas nuevas.", true);
          return;
        }
        formSyncBusy = true;
        try {
          const form = await googleFormRequest("forms/" + encodeURIComponent(formLink.formId));
          const responses = [];
          let pageToken = "";
          do {
            const result = await googleFormRequest(
              "forms/" +
                encodeURIComponent(formLink.formId) +
                "/responses?pageSize=500" +
                (pageToken ? "&pageToken=" + encodeURIComponent(pageToken) : ""),
            );
            responses.push(...(result.responses || []));
            pageToken = result.nextPageToken || "";
            if (responses.length > 100000)
              throw Error("El formulario contiene demasiadas respuestas.");
          } while (pageToken);
          const candidate = emptyData();
          candidate.kind = "camicas-intake";
          candidate.data.patients = answersToPatients(form, responses);
          candidate.data.categories = [];
          const preview = clone(db),
            report = mergeIntake(preview, candidate);
          if (report.patients || report.filled) {
            if (
              !mutate((s) => {
                mergeIntake(s, candidate);
              }, "Respuestas nuevas incorporadas.")
            )
              return;
          }
          formLink.lastSync = new Date().toISOString();
          saveFormLink();
          render();
          toast("Formulario actualizado: " + report.patients + " fichas nuevas.");
        } catch (error) {
          toast(error.message, true);
        } finally {
          formSyncBusy = false;
        }
      }
      actions["form-link"] = formLinkModal;
      actions["form-authorize"] = authorizeForm;
      actions["form-sync"] = syncForm;
      actions["form-disconnect"] = () => {
        if (formAccessToken && window.google?.accounts?.oauth2)
          google.accounts.oauth2.revoke(formAccessToken, () => {});
        formAccessToken = null;
        formTokenUntil = 0;
        formLink.enabled = false;
        saveFormLink();
        render();
        toast("Conexión desactivada. Tus fichas se conservan.");
      };
      setInterval(
        () => {
          if (!document.hidden && formAccessToken && Date.now() < formTokenUntil && !modal.open)
            syncForm();
        },
        5 * 60 * 1000,
      );
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && formAccessToken && Date.now() < formTokenUntil && !modal.open)
          syncForm();
      });
      const renderBeforeForms = render;
      render = function () {
        renderBeforeForms();
        if (view.page === "mas")
          main
            .querySelector(".settings-grid")
            .insertAdjacentHTML(
              "beforeend",
              `<section class="card"><h2>Formulario de pacientes</h2><p class="small muted" style="margin:14px 0">${formLink.enabled ? "Conexión configurada. Google pide autorizar la lectura de respuestas en este celular." : "La sincronización automática necesita configurar y autorizar la cuenta de Google."}</p>${formLink.lastSync ? `<p class="small muted">Última lectura: ${esc(new Intl.DateTimeFormat("es-AR", { dateStyle: "short", timeStyle: "short" }).format(new Date(formLink.lastSync)))}</p>` : ""}<div class="download-list">${btn("Configurar conexión", "form-link", "outline")}${formLink.enabled ? btn("Autorizar y sincronizar", "form-authorize", "primary") + btn("Desconectar", "form-disconnect", "outline") : ""}</div></section>`,
            );
      };

      if (formLink.enabled && formLink.clientId) loadGoogleIdentity().catch(() => {});

      // Short, sourced quotations. Sources are documented in the guide; the popup shows only the author.
      const welcomeQuotes = [
        {
          text: "Con la autocompasión, nos damos la misma amabilidad y apoyo que le daríamos a un buen amigo.",
          author: "Kristin Neff",
          source: "https://self-compassion.org/",
          sourceTitle: "Self-Compassion · sitio de Kristin Neff",
        },
        {
          text: "El límite de lo que aceptamos es el límite de nuestra libertad.",
          author: "Tara Brach",
          source: "https://www.tarabrach.com/judgment-acceptance-freedom-retreat/",
          sourceTitle: "Judgment, Acceptance and Freedom · Tara Brach",
        },
        {
          text: "Al habitar el momento presente, sé que este es un momento maravilloso.",
          author: "Thich Nhat Hanh",
          source: "https://web.plumvillage.app/item/calming-the-breath-gatha",
          sourceTitle: "Calming the Breath Gatha · Plum Village",
        },
        {
          text: "No hay un camino hacia la felicidad; la felicidad es el camino.",
          author: "Thich Nhat Hanh",
          source: "https://plumvillage.org/articles/teachings-on-true-transmission",
          sourceTitle: "Teachings on True Transmission · Plum Village",
        },
      ];
      const WELCOME_STORE = "camicas.v2.welcome";
      let welcomePrefs = {
          enabled: true,
          seen: false,
          lastShown: 0,
          lastIndex: -1,
          day: "",
          count: 0,
        },
        welcomeVisible = false,
        welcomeIndex = 0;
      try {
        const saved = JSON.parse(storageGet(WELCOME_STORE) || "null");
        if (saved && typeof saved === "object")
          welcomePrefs = { ...welcomePrefs, ...saved, enabled: saved.enabled !== false };
      } catch {}
      function saveWelcomePrefs() {
        try {
          localStorage.setItem(WELCOME_STORE, JSON.stringify(welcomePrefs));
        } catch {}
      }
      function welcomeDay(now) {
        const date = new Date(now);
        return `${date.getFullYear()}-${date.getMonth() + 1}-${date.getDate()}`;
      }
      function welcomeCanShow(prefs, now) {
        const count = prefs.day === welcomeDay(now) ? Number(prefs.count) || 0 : 0;
        return (
          prefs.enabled !== false &&
          count < 2 &&
          (!prefs.lastShown || now - Number(prefs.lastShown) >= 6 * 60 * 60 * 1000)
        );
      }
      function chooseWelcome() {
        const choices = welcomeQuotes.map((_, i) => i).filter((i) => i !== welcomePrefs.lastIndex);
        welcomeIndex = choices[Math.floor(Math.random() * choices.length)];
        const now = Date.now(),
          day = welcomeDay(now);
        welcomePrefs.count = welcomePrefs.day === day ? (Number(welcomePrefs.count) || 0) + 1 : 1;
        welcomePrefs.day = day;
        welcomePrefs.lastIndex = welcomeIndex;
        welcomePrefs.lastShown = now;
        welcomePrefs.seen = true;
        saveWelcomePrefs();
      }
      if (welcomeCanShow(welcomePrefs, Date.now())) {
        welcomeVisible = true;
        chooseWelcome();
      }
      const welcomeDialog = document.createElement("dialog");
      welcomeDialog.id = "welcome-dialog";
      welcomeDialog.setAttribute("aria-labelledby", "welcome-title");
      document.body.append(welcomeDialog);
      welcomeDialog.addEventListener("cancel", () => {
        welcomeVisible = false;
      });
      function renderWelcome() {
        if (welcomeVisible && welcomePrefs.enabled && !welcomeDialog.open) {
          const q = welcomeQuotes[welcomeIndex];
          welcomeDialog.innerHTML = `<div class="welcome-popup"><button class="icon-button welcome-close" data-act="welcome-dismiss" aria-label="Cerrar mensaje de bienvenida">×</button><span class="welcome-flower" aria-hidden="true">✿</span><h2 id="welcome-title">Un momento para vos</h2><blockquote>«${esc(q.text)}»</blockquote><div class="welcome-credit">${esc(q.author)}</div><button class="btn primary" data-act="welcome-dismiss" autofocus>Entrar a Camicas</button></div>`;
          welcomeDialog.showModal();
        }
        if (!welcomeVisible && welcomeDialog.open) welcomeDialog.close();
        if (view.page === "mas") {
          const card = main.querySelector(".settings-grid .card"),
            last = card?.querySelector('button[data-act="category"]');
          if (card && last)
            last.insertAdjacentHTML(
              "beforebegin",
              `<div class="setting-line"><span>Mensajes de bienvenida<small>Hasta dos al día, separados por 6 horas</small></span><button class="btn small outline" data-act="welcome-toggle" aria-pressed="${welcomePrefs.enabled}">${welcomePrefs.enabled ? "Activados" : "Desactivados"}</button></div>`,
            );
        }
      }
      actions["welcome-dismiss"] = () => {
        welcomeVisible = false;
        welcomeDialog.close();
      };
      actions["welcome-disable"] = () => {
        welcomePrefs.enabled = false;
        welcomeVisible = false;
        saveWelcomePrefs();
        render();
        toast("Mensajes de bienvenida desactivados. Podés reactivarlos en Más.");
      };
      actions["welcome-toggle"] = () => {
        welcomePrefs.enabled = !welcomePrefs.enabled;
        if (welcomeCanShow(welcomePrefs, Date.now())) {
          welcomeVisible = true;
          chooseWelcome();
        } else welcomeVisible = false;
        saveWelcomePrefs();
        render();
      };
      function maybeWelcome() {
        if (
          !document.hidden &&
          !welcomeDialog.open &&
          !document.getElementById("modal").open &&
          welcomeCanShow(welcomePrefs, Date.now())
        ) {
          welcomeVisible = true;
          chooseWelcome();
          renderWelcome();
        }
      }
      document.addEventListener("visibilitychange", maybeWelcome);
      window.addEventListener("pageshow", maybeWelcome);
      const renderWithoutWelcome = render;
      render = function () {
        renderWithoutWelcome();
        renderWelcome();
      };
      render();
    </script>
  </body>
</html>
